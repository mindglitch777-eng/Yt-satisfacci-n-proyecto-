name: daily-shorts
on:
  schedule: [{ cron: "0 9 * * *" }]   # 06:00 ARG, todos los días
  workflow_dispatch: { inputs: { count: { default: "4" } } }
permissions: { contents: write }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libcairo2-dev
      - run: pip install -r requirements.txt
      - run: python run.py --format mix --count ${{ github.event.inputs.count || 4 }}
      - run: python upload.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: guardar memoria anti-repetición
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add history.json uploaded.json && git commit -m "history $(date +%F)" && git push || true
